[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weddingapp-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",       # async PostgreSQL driver

    # Redis / task queue
    "redis>=5.0.0",
    "arq>=0.26.0",

    # S3-compatible object storage
    "boto3>=1.34.0",

    # HTTP client (for adapter calls)
    "httpx>=0.27.0",
    # fal.ai generation SDK
    "fal-client>=0.5.0",
    # Image processing — watermark, resize, format conversion
    "Pillow>=10.3.0",

    # Utilities
    "python-multipart>=0.0.9",  # file uploads
    "python-jose[cryptography]>=3.3.0",  # JWT
    "bcrypt>=4.0.0",
    "email-validator>=2.1.0",  # required by pydantic EmailStr
    "anthropic>=0.25.0",

    # Admin dashboard — browsable UI over SQLAlchemy models
    "sqladmin>=0.19.0",
    "itsdangerous>=2.1.0",  # required by Starlette SessionMiddleware (used by sqladmin auth)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # TestClient
    "asgi-lifespan>=2.1.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["B008"]  # FastAPI Depends() in function defaults is intentional

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
