name: Add More Templates (13 new categories)

on:
  workflow_dispatch: {}

jobs:
  add-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Add new templates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/add_more_templates.py
