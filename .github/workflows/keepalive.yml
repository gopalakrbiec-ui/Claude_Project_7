name: Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway API
        run: |
          curl -sf https://claudeproject7-production.up.railway.app/ping \
            && echo "API is up" \
            || echo "API did not respond"
