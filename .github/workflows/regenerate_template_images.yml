name: Regenerate Template Images

on:
  workflow_dispatch:
    inputs:
      template_id:
        description: 'Template ID to regenerate (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (generate + upload, skip DB update)'
        type: boolean
        required: false
        default: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx sqlalchemy asyncpg boto3 botocore

      - name: Run regenerate script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.template_id }}" ]; then
            ARGS="$ARGS --id ${{ inputs.template_id }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/regenerate_template_images.py $ARGS
